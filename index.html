<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Suporte Home TV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: uma coluna de celular (max 460px), uma tela por vez. Azul = Novo cliente, laranja = Suporte, verde-água e coral só na capa. */
:root{
  --bg:#ffffff; --ink:#0c1030; --muted:#566080; --line:#dce4f2; --surface:#f5f8fe;
  --blue:#1a56f0; --blue-soft:#eef3ff; --blue-line:#b9cffc;
  --orange:#e8550f; --orange-soft:#fff1e7; --orange-line:#f9c8a4;
  --teal:#009a89; --teal-soft:#e7faf8; --teal-line:#bfe9e4;
  --coral:#f04a2e; --coral-soft:#fdf0ef; --coral-line:#f8c9c3;
  --good:#0a7a4a; --good-bg:#e1f5ea; --warn:#7d4f06; --warn-bg:#fff1cf; --bad:#a8211a; --bad-bg:#fdeae8; --none:#566080; --none-bg:#eceff6;
  --acc:var(--blue); --acc-soft:var(--blue-soft); --acc-line:var(--blue-line);
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-block:12px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{max-width:460px;margin-inline:auto}
.scr{display:flex;flex-direction:column;gap:14px;min-width:0}
.scr[data-mode="sup"]{--acc:var(--orange);--acc-soft:var(--orange-soft);--acc-line:var(--orange-line)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}

/* topo */
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.back{width:44px;height:44px;border-radius:50%;border:0;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.back svg{width:24px;height:24px}
.pill{justify-self:center;background:var(--acc);color:#fff;font-family:var(--f-display);font-weight:800;font-size:14px;letter-spacing:.22em;text-transform:uppercase;padding:7px 20px 5px;border-radius:999px}
.logo{display:block;margin-inline:auto;height:88px;width:auto;max-width:100%}
.title{font-size:clamp(26px,7.4vw,32px);font-weight:800;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:16px}

/* capa: cabe em uma tela. O mascote ocupa a altura que sobrar. */
.cover{height:calc(100vh - 44px);height:calc(100dvh - 44px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px;max-height:880px;gap:clamp(6px,1.4dvh,12px);justify-content:center}
.chead{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1dvh,8px);flex:none}
.eyebrow{font-family:var(--f-display);font-weight:800;letter-spacing:.3em;text-transform:uppercase;font-size:13px;text-align:center}
.clogo{height:clamp(40px,8dvh,72px);width:auto;max-width:100%;display:block}
.ctitle{font-size:clamp(22px,3.8dvh,30px);font-weight:800;text-align:center}
.hcard{flex:1 1 0;min-height:0;max-height:300px;border-radius:24px;padding:8px 14px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.hcard .mascot{flex:1 1 0;min-height:44px;max-width:100%;width:auto;object-fit:contain;display:block}
.hcard h2{flex:none;font-size:clamp(26px,4.6dvh,36px);font-weight:800}
.hcard p{flex:none;color:var(--muted);font-size:14px;line-height:1.25}
.hc-novo{background:#e4f8f6;border:1.5px solid var(--teal-line)}
.hc-sup{background:#feeded;border:1.5px solid var(--coral-line)}
.cta{flex:none;margin-top:6px;width:min(78%,290px);min-height:clamp(40px,6dvh,50px);border:0;border-radius:999px;color:#fff;font-family:var(--f-display);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.cta:active{transform:scale(.97)}
.cta svg{width:22px;height:22px}
.cta-teal{background:var(--teal)} .cta-coral{background:var(--coral)}
.cover .linkbtn{flex:none;min-height:36px;font-size:14px}
.small{font-size:13px;color:var(--muted);text-align:center}

/* marcas */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-height:68px;padding:10px 12px;border-radius:18px;background:#fff;border:1.5px solid var(--acc-line);text-align:left;box-shadow:0 2px 8px rgba(12,16,48,.06);min-width:0;transition:transform .12s}
.brand:active{transform:scale(.97)}
.brand svg{width:34px;height:30px;flex:none;color:var(--acc)}
.brand .bn{display:block;font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.05}
.brand .bl{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.brand span.t{min-width:0}
.linkbtn{background:none;border:0;color:var(--acc);font-weight:800;font-size:18px;text-decoration:underline;text-underline-offset:4px;min-height:48px;align-self:center}

/* apps */
.bline{display:flex;align-items:baseline;justify-content:center;gap:8px;flex-wrap:wrap}
.bname{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--acc)}
.bleg{color:var(--muted);font-size:15px}
.callout{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600}
.ctl{display:flex;flex-direction:column;gap:6px}
.lab{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 15px;border-radius:999px;background:#fff;border:1.5px solid var(--acc-line);font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.app{display:grid;grid-template-columns:56px minmax(0,1fr) 16px;gap:12px;align-items:center;text-align:left;padding:12px;border-radius:18px;background:#fff;border:1.5px solid var(--line);width:100%}
.app:active{background:var(--acc-soft)}
.atxt{display:flex;flex-direction:column;gap:3px;min-width:0}
.aname{font-family:var(--f-display);font-weight:800;font-size:19px;line-height:1.1}
.ameta{font-size:14px;color:var(--muted)}
.chev{color:var(--acc);font-size:26px;font-weight:700;line-height:1}
.why{font-size:13px;color:var(--bad);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.t-o{background:var(--good-bg);color:var(--good)} .t-d{background:var(--acc-soft);color:var(--acc)}
.t-p{background:var(--warn-bg);color:var(--warn)} .t-n{background:var(--bad-bg);color:var(--bad)} .t-u{background:var(--none-bg);color:var(--none)}
.mini{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.mini.m-o{border-color:#9fd8b8;color:var(--good)} .mini.m-d{border-color:var(--acc-line);color:var(--acc)} .mini.m-p{border-color:#efd08a;color:var(--warn)} .mini.m-n{border-color:#f0b4af;color:var(--bad);text-decoration:line-through}
.tile{width:56px;height:56px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:#14162b;flex:none}
.tile img{width:100%;height:100%;object-fit:cover;transform:scale(1.1);display:block}
.tile.round{border-radius:50%} .tile.round img{transform:none}
.tile.ph{background:linear-gradient(135deg,#3b2a8f,#e8550f);color:#fff;font-family:var(--f-display);font-weight:800;font-size:22px}
.tile.big{width:84px;height:84px;border-radius:22px} .tile.big.round{border-radius:50%}
.more{min-height:48px;border-radius:14px;border:1.5px dashed var(--acc-line);background:#fff;font-weight:800;color:var(--acc);width:100%}
.empty{background:var(--surface);border-radius:18px;padding:18px;text-align:center;color:var(--muted)}

/* detalhe */
.hero{display:flex;gap:14px;align-items:center}
.hero h1{font-size:30px;font-weight:800}
.hero .tags{margin-top:6px}
.card{border:1.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fff}
.card h3{font-size:18px;font-weight:800;color:var(--acc)}
.kv{display:flex;flex-direction:column;gap:2px}
.kv b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.big{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.15}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rows li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.rows li:last-child{border-bottom:0;padding-bottom:0}
.rows .sn{font-weight:800}
.rows .note{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.srv{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.srv.sel{border-color:var(--acc);background:var(--acc-soft)}
.srv.dim{opacity:.55}
.srv header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.srv header b{font-family:var(--f-display);font-weight:800;font-size:18px}
.srv p{font-size:14.5px}
ol.steps,ul.checks,ul.pend{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
ul.pend li::marker{color:var(--warn)}
.card.warn{background:var(--warn-bg);border-color:#f0d58f}
.card.warn h3{color:var(--warn)}
.card.warn ul{color:#4b3004}
.src{font-size:14px;display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.src a{color:var(--acc);font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.ativar{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;background:var(--acc);color:#fff;font-family:var(--f-display);font-weight:800;font-size:19px;text-decoration:none;align-self:flex-start;transition:transform .12s}
.ativar:active{transform:scale(.97)}
.ativar svg{width:20px;height:20px}
.hero .ativar{margin-top:8px}

/* matriz */
.scroll{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px}
table.mx{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.mx th,.mx td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:800;z-index:1}
.mx thead th{background:var(--surface);font-size:12px}
.mx tr:last-child td{border-bottom:0}
.c-o{background:var(--good-bg);color:var(--good);font-weight:800}.c-d{background:var(--blue-soft);color:var(--blue);font-weight:800}
.c-p{background:var(--warn-bg);color:var(--warn);font-weight:800}.c-n{background:var(--bad-bg);color:var(--bad);font-weight:800}.c-u{color:#9aa2bb}
.c-y{background:var(--good-bg);color:var(--good);font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function tile(app,big){

  if(app.img&&IMG[app.img])return '<span class="'+cls+'"><img src="'+IMG[app.img]+'" alt=""></span>';
  return '<span class="'+cls+' ph">'+esc(app.n.charAt(0))+'</span>';
}

}

   '<img class="clogo" src="'+IMG.c_logo+'" alt="Home TV Streaming">'+
   '<h1 class="ctitle">Como podemos ajudar?</h1></header>'+
   '<article class="hcard hc-novo"><img class="mascot" src="'+IMG.c_novo+'" alt=""><h2>Novo cliente</h2><p>Encontre o melhor aplicativo ideal para a TV do cliente</p>'+
     '<button class="cta cta-teal" data-a="start" data-v="novo">Começar '+ICON.arrow+'</button></article>'+
   '<article class="hcard hc-sup"><img class="mascot" src="'+IMG.c_sup+'" alt=""><h2>Suporte</h2><p>Identificando o problema do aplicativo</p>'+
     '<button class="cta cta-coral" data-a="start" data-v="sup">Começar '+ICON.arrow+'</button></article>'+
   '<button class="linkbtn" data-a="nav" data-v="matriz">Matriz de conferência · versão de teste</button>'+
  '</div>';
}

function vMarcas(){
  var sup=state.mode==='sup';
  var h=BRANDS.map(function(b){
    var ic=ICON[b.icon==='box'?'box':b.icon==='stick'?'stick':'tv'];
    return '<button class="brand" data-a="brand" data-v="'+b.id+'">'+ic+'<span class="t"><span class="bn">'+esc(b.n)+'</span><span class="bl">'+esc(b.leg)+'</span></span></button>';
  }).join('');
  return '<div class="scr" data-mode="'+state.mode+'">'+top('inicio',sup?'Suporte':'Novo cliente')+
   '<img class="logo" src="'+IMG.logo+'" alt="Home TV Streaming">'+
   '<h1 class="title">Qual é a marca da TV?</h1>'+
   '<p class="sub">Selecione a marca ou o dispositivo do cliente</p>'+
   '<div class="grid">'+h+'</div>'+
   '<button class="linkbtn" data-a="brand" data-v="outra">Não encontrei minha marca</button>'+
   '<p class="small">O sistema pode variar conforme o modelo.</p></div>';
}

function srvShort(app){var s=app.srv[state.srv];return 'Servidor '+SRVN[state.srv]+': '+s[1]}

function rowHtml(app,list,why){
  var sup=state.mode==='sup', multi=!state.sys&&state.brand.sys.length>1&&state.brand.id!=='outra';
  var meta=sup?app.acc:(state.srv==='todos'?app.lic:srvShort(app));
  var tg=tag(best(app,list));
  if(multi)tg+=state.brand.sys.map(function(k){return '<span class="mini m-'+app.s[k][0]+'">'+SYSS[k]+'</span>'}).join('');
  return '<button class="app" data-a="app" data-v="'+app.id+'">'+tile(app)+
   '<span class="atxt"><span class="aname">'+esc(app.n)+'</span><span class="ameta">'+esc(meta)+'</span><span class="tags">'+tg+'</span>'+(why?'<span class="why">'+esc(why)+'</span>':'')+'</span>'+
   '<span class="chev" aria-hidden="true">›</span></button>';
}

function whyOut(app,list){
  if(state.srv!=='todos'&&app.srv[state.srv][0]==='n')return 'Incompatível com o servidor '+SRVN[state.srv];
  var b=best(app,list);
  if(b==='n'){for(var i=0;i<list.length;i++){var s=app.s[list[i]];if(s[0]==='n')return s[1]||'Não indicado para esta TV'}return 'Não indicado para esta TV'}
  return 'Compatibilidade com esta TV ainda não confirmada';
}

function vApps(){
  var b=state.brand, sup=state.mode==='sup', list=sysList();
  var needSys=b.id==='outra'&&!state.sys;
  var h='<div class="scr" data-mode="'+state.mode+'">'+top(sup?'smarcas':'marcas',sup?'Suporte':'Novo cliente');
  h+='<div class="bline"><span class="bname">'+esc(b.n)+'</span><span class="bleg">'+esc(b.leg)+'</span></div>';
  h+='<h1 class="title">'+(sup?'Qual aplicativo o cliente usa?':'Aplicativos para esta TV')+'</h1>';
  if(b.note)h+='<div class="callout">'+esc(b.note)+'</div>';
  if(b.sys.length>1){
    h+='<div class="ctl"><span class="lab">Sistema da TV</span><div class="chips" role="group" aria-label="Sistema da TV">';
    if(b.id!=='outra')h+=chip('sys','',  'Não sei', !state.sys);
    b.sys.forEach(function(k){h+=chip('sys',k,SYSS[k],state.sys===k)});
    h+='</div></div>';
  }else if(b.sys.length===1){
    h+='<p class="sub">Sistema mais comum: '+esc(SYSN[b.sys[0]])+'</p>';
  }
  if(!sup){
    h+='<div class="ctl"><span class="lab">Servidor do cliente</span><div class="chips" role="group" aria-label="Servidor do cliente">'+
      chip('srv','todos','Todos',state.srv==='todos')+chip('srv','five','Five',state.srv==='five')+chip('srv','aura','Aura',state.srv==='aura')+chip('srv','spark','Spark',state.srv==='spark')+'</div></div>';
  }
  if(needSys){
    h+='<div class="empty">Escolha o sistema da TV para ver os aplicativos.</div></div>';
    return h;
  }
  var items=A.map(function(a){return {a:a,b:best(a,list)}});
  items.sort(function(x,y){return RANK[y.b]-RANK[x.b]});
  if(sup){
    h+='<div class="list">'+items.map(function(it){return rowHtml(it.a,list,'')}).join('')+'</div>';
    h+='<p class="hint">Aqui aparecem todos os aplicativos, mesmo os ainda não confirmados para esta TV, porque o cliente pode já estar usando um deles.</p>';
  }else{
    var main=[],out=[];
    items.forEach(function(it){
      var srvN=state.srv!=='todos'&&it.a.srv[state.srv][0]==='n';
      if(srvN||it.b==='n'||it.b==='u')out.push(it);else main.push(it);
    });
    if(main.length)h+='<div class="list">'+main.map(function(it){return rowHtml(it.a,list,'')}).join('')+'</div>';
    else h+='<div class="empty">Nenhum aplicativo confirmado para esta combinação de TV e servidor.</div>';
    if(out.length){
      h+='<button class="more" data-a="more" aria-expanded="'+(state.more?'true':'false')+'">'+(state.more?'Ocultar':'Ver')+' não indicados ou não confirmados ('+out.length+')</button>';
      if(state.more)h+='<div class="list">'+out.map(function(it){return rowHtml(it.a,list,whyOut(it.a,list))}).join('')+'</div>';
    }
  }
  return h+'</div>';
}

function vApp(){
  var app=byId(state.app), b=state.brand, sup=state.mode==='sup', list=sysList();
  var h='<div class="scr" data-mode="'+state.mode+'">'+top(sup?'sapps':'apps',sup?'Suporte':'Novo cliente');
  h+='<div class="hero">'+tile(app,true)+'<div><h1>'+esc(app.n)+'</h1><div class="tags">'+tag(best(app,list))+'</div>'+ativarBtn(app)+'</div></div>';

  var sysShow=state.allsys?SYSKEYS:(b.id==='outra'&&!state.sys?SYSKEYS:list);
  h+='<section class="card"><h3>Nesta TV: '+esc(b.n)+'</h3><ul class="rows">'+sysShow.map(function(k){
    var s=app.s[k];return '<li><span class="sn">'+esc(SYSN[k])+'</span>'+tag(s[0])+(s[1]?'<span class="note">'+esc(s[1])+'</span>':'')+'</li>';
  }).join('')+'</ul><button class="more" data-a="allsys">'+(state.allsys?'Mostrar só esta TV':'Ver todos os sistemas')+'</button></section>';

  h+='<section class="card"><h3>Como o cliente acessa</h3>'+
     '<div class="kv"><b>Tipo de acesso</b><span class="big">'+esc(app.acc)+'</span></div>'+
     '<div class="kv"><b>O cliente</b><span>'+esc(app.cli)+'</span></div>'+
     '<div class="kv"><b>O suporte</b><span>'+esc(app.sup)+'</span></div>'+
     (app.painel?'<div class="kv"><b>Painel</b><span>'+esc(app.painel)+'</span></div>':'')+'</section>';

  h+='<section class="card"><h3>Licença por servidor</h3><div class="chips" role="group" aria-label="Servidor do cliente">'+
     chip('srv','todos','Todos',state.srv==='todos')+chip('srv','five','Five',state.srv==='five')+chip('srv','aura','Aura',state.srv==='aura')+chip('srv','spark','Spark',state.srv==='spark')+'</div>';
  ['five','aura','spark'].forEach(function(k){
    var s=app.srv[k], sel=state.srv===k, dim=state.srv!=='todos'&&!sel;
    h+='<div class="srv'+(sel?' sel':'')+(dim?' dim':'')+'"><header><b>'+SRVN[k]+'</b><span class="tag '+SRVST[s[0]][1]+'">'+SRVST[s[0]][0]+'</span></header><p>'+esc(s[2])+'</p>'+(app.ativar&&(app.ativarSrv||[]).indexOf(k)>=0?ativarBtn(app):'')+'</div>';
  });
  h+='</section>';

  if(sup){
    h+='<section class="card"><h3>Verificações rápidas</h3><ul class="checks">'+app.check.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><p class="hint">Montadas a partir do tipo de acesso e da licença. Ajuste com as orientações reais da equipe.</p></section>';
  }else{
    h+='<section class="card"><h3>Passo a passo do cadastro</h3><ol class="steps">'+app.steps.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol></section>';
  }
  h+='<section class="card warn"><h3>Pendências internas</h3><ul class="pend">'+app.pend.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></section>';
  if(app.src&&app.src.length){
    h+='<section class="card"><h3>Fontes da pesquisa</h3><div class="src">'+app.src.map(function(s){return '<a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+'</a>'}).join('')+'</div></section>';
  }
  return h+'</div>';
}

function vMatriz(){
  var h='<div class="scr" data-mode="novo">'+top('inicio','Conferência');
  h+='<h1 class="title">Matriz de compatibilidade</h1><p class="sub">Aplicativo por sistema e por servidor, como está cadastrado agora.</p>';
  h+='<div class="legend"><span class="tag t-o">OK = confirmado</span><span class="tag t-d">Decl. = loja ou site</span><span class="tag t-p">Prov. = confirmar</span><span class="tag t-n">Não = não indicar</span><span class="tag t-u">— = sem confirmação</span></div>';
  h+='<div class="scroll"><table class="mx"><thead><tr><th>Aplicativo</th>'+SYSKEYS.map(function(k){return '<th>'+SYSS[k]+'</th>'}).join('')+'</tr></thead><tbody>';
  A.forEach(function(a){h+='<tr><td>'+esc(a.n)+'</td>'+SYSKEYS.map(function(k){var c=a.s[k][0];return '<td class="c-'+c+'">'+MXC[c]+'</td>'}).join('')+'</tr>'});
  h+='</tbody></table></div>';
  h+='<div class="scroll"><table class="mx" style="min-width:420px"><thead><tr><th>Aplicativo</th><th>Five</th><th>Aura</th><th>Spark</th></tr></thead><tbody>';
  A.forEach(function(a){h+='<tr><td>'+esc(a.n)+'</td>'+['five','aura','spark'].map(function(k){var s=a.srv[k];var cl=s[0]==='y'?'c-y':s[0]==='n'?'c-n':'c-p';return '<td class="'+cl+'">'+esc(s[1])+'</td>'}).join('')+'</tr>'});
  h+='</tbody></table></div>';
  h+='<p class="hint">Cada sistema marcado Prov. ou — está listado nas pendências do aplicativo para a gente acertar depois.</p></div>';
  return h;
}

function render(){
  var s=state.screen, v;
  if(s==='inicio')v=vInicio();
  else if(s==='marcas'||s==='smarcas')v=vMarcas();
  else if(s==='apps'||s==='sapps')v=vApps();
  else if(s==='app'||s==='sapp')v=vApp();
  else v=vMatriz();
  ROOT.innerHTML=v;
}

/* ---------- navegação ---------- */
function validScreen(n){
  if(!KNOWN[n])return 'inicio';
  if(NEEDB[n]&&!state.brand)return 'inicio';
  if(NEEDA[n]&&!state.app)return 'inicio';
  return n;
}
function modeFor(n){return (n==='smarcas'||n==='sapps'||n==='sapp')?'sup':(n==='marcas'||n==='apps'||n==='app')?'novo':state.mode}
function show(n,scroll){
  n=validScreen(n);state.screen=n;state.mode=modeFor(n);render();
  if(scroll!==false){try{window.scrollTo(0,0)}catch(e){}}
}
function nav(n){
  if(location.hash==='#'+n){show(n)}else{try{location.hash=n}catch(e){show(n)}}
}
function onAction(a,v){
  if(a==='nav'){nav(v)}
  else if(a==='start'){state.mode=v;nav(v==='sup'?'smarcas':'marcas')}
  else if(a==='brand'){
    state.brand=v==='outra'?OUTRA:BRANDS.filter(function(b){return b.id===v})[0];
    state.sys=null;state.more=false;state.allsys=false;state.app=null;
    nav(state.mode==='sup'?'sapps':'apps');
  }
  else if(a==='sys'){state.sys=v||null;state.more=false;show(state.screen,false)}
  else if(a==='srv'){state.srv=v;state.more=false;show(state.screen,false)}
  else if(a==='more'){state.more=!state.more;show(state.screen,false)}
  else if(a==='allsys'){state.allsys=!state.allsys;show(state.screen,false)}
  else if(a==='app'){state.app=v;state.allsys=false;nav(state.mode==='sup'?'sapp':'app')}
}
ROOT.addEventListener('click',function(e){
  var t=e.target;
  while(t&&t!==ROOT&&!(t.getAttribute&&t.getAttribute('data-a')))t=t.parentNode;
  if(!t||t===ROOT)return;
  onAction(t.getAttribute('data-a'),t.getAttribute('data-v')||'');
});
window.addEventListener('hashchange',function(){show((location.hash||'').replace('#','')||'inicio')});
show((location.hash||'').replace('#','')||'inicio',false);

if(typeof module!=='undefined')module.exports={state:state,show:show,onAction:onAction,A:A,BRANDS:BRANDS,best:best};
})();
</script>

</body></html>
